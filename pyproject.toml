[project]
name = "robot-play"
version = "0.1.0"
description = "A harness where LLMs orchestrate simulated robots through IK and motion-planning skills, and learn from experience in context."
requires-python = ">=3.11"
dependencies = [
  "mujoco==4.0.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "anthropic>=0.60",
  "openai>=1.90",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_play"]
